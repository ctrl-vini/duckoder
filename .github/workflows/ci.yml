name: CI

on:
  pull_request:
  push:
    # Every branch, so a push without an open pull request is checked too. Tags are left out:
    # the release workflow calls this one for them.
    branches: ["**"]
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version and the one used in development.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest
