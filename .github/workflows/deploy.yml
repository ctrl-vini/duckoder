name: Deploy

# Builds a version's image, pushes it to Amazon ECR and updates the EC2 server through Systems
# Manager. The release workflow calls it after publishing each version; to deploy one by hand,
# run it from the Actions tab with the version's tag picked in "Use workflow from". The AWS setup,
# the AWS_ROLE_ARN secret and the AWS_REGION and EC2_INSTANCE_ID variables are in the README, as
# is the optional DUCKODER_DOMAIN variable, which serves the site over HTTPS at that domain. The
# key of the Claude API is not here: the instance reads it from Parameter Store, as the README
# explains.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job sign in to AWS with a short-lived token instead of stored access keys.
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    # The first deploy also downloads the model to the server.
    timeout-minutes: 60
    # One deploy at a time: a newer version waits for the one being installed.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      REGION: ${{ vars.AWS_REGION }}
      DOMAIN: ${{ vars.DUCKODER_DOMAIN }}
    steps:
      - name: Check that a version tag was picked
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Pick a version tag, such as v1.3.0, in \"Use workflow from\"."
          exit 1

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The image is built for Intel and Graviton (Arm) instances alike.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/duckoder:${{ github.ref_name }}
          # Only the image itself: attestations would show up in ECR as extra untagged images.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the server
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          jq -n --rawfile script deploy/update-server.sh \
            --arg tag "$TAG" --arg registry "$REGISTRY" --arg repository "$GITHUB_REPOSITORY" \
            --arg region "$REGION" --arg domain "$DOMAIN" \
            '{
              commands: [
                "export TAG=\($tag) IMAGE=\($registry)/duckoder:\($tag) REGISTRY=\($registry) REPOSITORY=\($repository) REGION=\($region) DOMAIN=\($domain)",
                $script
              ],
              executionTimeout: ["3600"]
            }' > parameters.json
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "Duckoder $TAG" \
            --parameters file://parameters.json --query Command.CommandId --output text)
          echo "Sent the update to $INSTANCE_ID as command $command_id."

          # The invocation shows up a few seconds after the command is sent.
          while true; do
            sleep 10
            if ! status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2> error.txt); then
              grep -q InvocationDoesNotExist error.txt && continue
              cat error.txt >&2
              exit 1
            fi
            case "$status" in
              Pending | InProgress | Delayed | Cancelling) ;;
              *) break ;;
            esac
          done

          for stream in StandardOutputContent StandardErrorContent; do
            aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query "$stream" --output text
          done
          if [ "$status" != Success ]; then
            echo "::error::The server update ended as $status."
            exit 1
          fi

      - name: Check the site
        if: env.DOMAIN != ''
        run: |
          url="https://www.${DOMAIN#www.}/version"
          # Caddy asks Let's Encrypt for the certificate in the first seconds after starting.
          if curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$url"; then
            echo
            echo "The site answers at $url."
          else
            echo "::warning::$url does not answer yet: check the domain's DNS records and that ports 80 and 443 are open."
          fi
